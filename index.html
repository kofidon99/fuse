<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Fuse - a merge puzzle about agreement. Same ranks fuse, the charge survives only if they all agreed, and four of a charge blows.">
<meta name="theme-color" content="#e9edfa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%;background:#e9edfa}

<title>Fuse</title>
<style>
  :root{ color-scheme: light; }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:#e9edfa; color:#1e2440; overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app{
    position:fixed; inset:0; overflow:hidden; background:#e9edfa;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #c{ display:block; position:absolute; inset:0; }

  #sysbar{ position:absolute; top:14px; right:14px; z-index:6; display:flex; gap:9px; }
  .sysbtn{
    width:42px; height:42px; border-radius:13px; border:1px solid rgba(30,36,64,.22);
    background:rgba(250,251,255,.75); color:#4f5c8f; cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:transform .12s ease, background .12s ease;
  }
  .sysbtn:hover{ background:#fafbff; }
  .sysbtn:active{ transform:scale(.92); }
  .sysbtn svg{ width:20px; height:20px; display:block; }

  .overlay{
    position:absolute; inset:0; z-index:5; padding:24px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:15px;
    text-align:center;
    background:radial-gradient(120% 92% at 50% 40%, rgba(248,250,255,.92) 0%, rgba(186,196,230,.96) 74%);
    color:#1e2440;
  }
  .logo{
    font-size:clamp(40px,12vmin,80px); font-weight:900; letter-spacing:-.02em; line-height:.92;
    margin:0; text-transform:uppercase; color:#3a3f78;
    text-shadow:0 3px 0 #c3cbef, 0 9px 24px rgba(50,58,120,.3);
  }
  .tagline{
    margin:0; font-size:clamp(11px,2.8vmin,13px); letter-spacing:.3em; text-transform:uppercase;
    color:#6470a8; font-weight:800;
  }
  .btn{
    appearance:none; -webkit-appearance:none; border:0; cursor:pointer; font-family:inherit;
    font-size:clamp(15px,3.6vmin,18px); font-weight:900; letter-spacing:.15em; text-transform:uppercase;
    padding:17px 42px; border-radius:16px; color:#2a1a05; margin-top:4px;
    background:linear-gradient(180deg,#ffc178 0%,#f5892f 100%);
    box-shadow:0 5px 0 #bc5a17, 0 12px 26px rgba(120,70,20,.28);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .btn:hover{ background:linear-gradient(180deg,#ffd096 0%,#ff9a45 100%); }
  .btn:active{ transform:translateY(4px); box-shadow:0 1px 0 #bc5a17, 0 6px 14px rgba(120,70,20,.3); }
  .btn.ghost{
    background:transparent; color:#4f5c8f; padding:12px 26px; font-size:13px; letter-spacing:.18em;
    box-shadow:0 0 0 1px rgba(79,92,143,.34) inset;
  }
  .btn.ghost:hover{ background:rgba(255,255,255,.46); }
  .btn.ghost:active{ transform:translateY(2px); box-shadow:0 0 0 1px rgba(79,92,143,.34) inset; }
  .hint{
    margin:6px 0 0; font-size:clamp(11px,2.7vmin,13px); line-height:1.75; color:#5a648f;
    letter-spacing:.04em; max-width:35ch;
  }
  .hint b{ color:#1e2440; font-weight:800; }

  .scorecard{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .stat{
    min-width:126px; padding:14px 20px; border-radius:18px;
    background:rgba(250,251,255,.8); border:1px solid rgba(79,92,143,.2);
  }
  .stat .k{ font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:#8b93b8; font-weight:800; }
  .stat .v{ font-size:clamp(28px,7.4vmin,40px); font-weight:900; color:#1e2440; line-height:1.15; }
  .stat.best .v{ color:#ff9430; }
  .headline{
    margin:0; font-size:clamp(26px,7.6vmin,44px); font-weight:900; letter-spacing:.02em; text-transform:uppercase;
    color:#3a3f78; text-shadow:0 3px 0 #c3cbef;
  }
  .record{ margin:0; font-size:12px; font-weight:900; letter-spacing:.28em; text-transform:uppercase; color:#ff9430; }
  .runstats{
    margin:0; font-size:12px; letter-spacing:.12em; color:#5a648f; text-transform:uppercase;
    font-weight:800; line-height:1.9; max-width:32ch; text-wrap:balance;
  }

  :focus-visible{ outline:3px solid #f5892f; outline-offset:3px; }

  .tiers{ display:flex; gap:8px; justify-content:center; margin:2px 0 0; width:100%; max-width:430px; }
  .tier{
    appearance:none; -webkit-appearance:none; cursor:pointer; font-family:inherit;
    border:1px solid rgba(79,92,143,.24); background:rgba(250,251,255,.66); color:#5a648f;
    padding:11px 9px; border-radius:14px; flex:1 1 0; min-width:0;
    display:flex; flex-direction:column; gap:4px; align-items:center; justify-content:center;
    transition:border-color .14s ease, background .14s ease, transform .12s ease, color .14s ease;
  }
  .tier:hover{ background:#fafbff; }
  .tier:active{ transform:scale(.97); }
  .tier .tn{ font-size:12px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; }
  .tier .tb{ font-size:10px; letter-spacing:.02em; line-height:1.3; color:#8b93b8; }
  .tier[aria-checked="true"]{
    border-color:#7a6cf0; background:#e4e2ff; color:#3a3f78;
    box-shadow:0 0 0 2px rgba(122,108,240,.3);
  }
  .tier[aria-checked="true"] .tb{ color:#6470a8; }

  .suggest{
    display:flex; flex-direction:column; gap:9px; align-items:center; margin:0;
    padding:13px 18px; border-radius:16px;
    background:rgba(216,241,253,.9); border:1px solid rgba(122,108,240,.42);
  }
  .suggest .msg{ margin:0; font-size:12px; letter-spacing:.05em; color:#3a3f78; font-weight:800; max-width:31ch; }
  .suggest .btn.ghost{ margin:0; color:#3a3f78; box-shadow:0 0 0 1px rgba(122,108,240,.5) inset; }

  .legend{ display:flex; gap:18px; justify-content:center; align-items:center; margin:2px 0 0; flex-wrap:wrap; }
  .lg{ display:flex; align-items:center; gap:7px; font-size:11px; font-weight:800; letter-spacing:.12em;
       text-transform:uppercase; color:#5a648f; }
  .lg i{ width:20px; height:20px; display:block; border-radius:7px; position:relative; }
  .lg i::after{ content:''; position:absolute; inset:0; display:block; }
  .lg i.pos{ background:linear-gradient(160deg,#ffb45e 0%,#ff8a1e 100%); box-shadow:0 0 0 1px rgba(150,80,10,.4); }
  .lg i.neg{ background:linear-gradient(160deg,#78b0ff 0%,#3f7fe8 100%); box-shadow:0 0 0 1px rgba(24,60,130,.45); }
  .lg i.nil{ background:linear-gradient(160deg,#b6bdd0 0%,#8e97ad 100%); box-shadow:0 0 0 1px rgba(50,58,80,.35); }
</style>

<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="sysbar">
    <button class="sysbtn" id="btnSound" type="button" aria-label="Toggle sound"></button>
    <button class="sysbtn" id="btnPause" type="button" aria-label="Pause"></button>
  </div>

  <div class="overlay" id="ovMenu">
    <h1 class="logo">Fuse</h1>
    <p class="tagline">Merge keeps the charge · four blows</p>
    <div class="legend">
      <span class="lg"><i class="pos"></i>Plus</span>
      <span class="lg"><i class="neg"></i>Minus</span>
      <span class="lg"><i class="nil"></i>Dead</span>
    </div>
    <div class="tiers" id="tierPick" role="radiogroup" aria-label="Difficulty"></div>
    <button class="btn" id="btnPlay" type="button">Charge Up</button>
    <p class="hint" id="menuHint"></p>
  </div>

  <div class="overlay" id="ovOver" hidden>
    <h2 class="headline" id="overTitle">Burnt Out</h2>
    <p class="record" id="newRecord" hidden>New Record</p>
    <div class="scorecard">
      <div class="stat"><div class="k">Score</div><div class="v" id="finalScore">0</div></div>
      <div class="stat best"><div class="k" id="bestLabel">Best</div><div class="v" id="bestScore">0</div></div>
    </div>
    <p class="runstats" id="runStats"></p>
    <div class="suggest" id="suggestBox" hidden>
      <p class="msg" id="suggestMsg"></p>
      <button class="btn ghost" id="btnSuggest" type="button"></button>
    </div>
    <button class="btn" id="btnAgain" type="button">Again</button>
    <button class="btn ghost" id="btnMenu" type="button">Menu</button>
  </div>

  <div class="overlay" id="ovPause" hidden>
    <h2 class="headline">Paused</h2>
    <button class="btn" id="btnResume" type="button">Resume</button>
    <button class="btn ghost" id="btnQuit" type="button">Pull the Plug</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  /* =========================================================================
     1. PLATFORM BRIDGE — YouTube Playables SDK with safe fallbacks.
     ========================================================================= */
  var YT = (typeof window !== 'undefined' && window.ytgame) ? window.ytgame : null;

  var Platform = {
    audioAllowed: true, _firstFrameSent: false, _readySent: false,

    init: function (onPause, onResume, onAudioChange) {
      if (!YT) return;
      try { if (YT.system && YT.system.onPause) YT.system.onPause(onPause); } catch (e) {}
      try { if (YT.system && YT.system.onResume) YT.system.onResume(onResume); } catch (e) {}
      try {
        if (YT.system && typeof YT.system.isAudioEnabled === 'function') {
          this.audioAllowed = !!YT.system.isAudioEnabled();
        }
        if (YT.system && YT.system.onAudioEnabledChange) {
          YT.system.onAudioEnabledChange(function (on) { Platform.audioAllowed = !!on; onAudioChange(); });
        }
      } catch (e) {}
    },
    firstFrame: function () {
      if (this._firstFrameSent) return;
      this._firstFrameSent = true;
      try { if (YT && YT.game && YT.game.firstFrameReady) YT.game.firstFrameReady(); } catch (e) {}
    },
    ready: function () {
      if (this._readySent) return;
      this._readySent = true;
      try { if (YT && YT.game && YT.game.gameReady) YT.game.gameReady(); } catch (e) {}
    }
  };

  /* =========================================================================
     2. STORAGE
     ========================================================================= */
  var SAVE_KEY = 'fuse.v1';

  var Store = {
    data: {
      bests: { cruise: 0, drive: 0, redline: 0 },
      bestBlast: { cruise: 0, drive: 0, redline: 0 },
      bestRank: { cruise: 0, drive: 0, redline: 0 },
      tier: 'drive', runs: 0, muted: false,
      quickDeaths: 0, offeredDown: false, offeredUp: false
    },
    best: function (id) { return Store.data.bests[id || Store.data.tier] || 0; },
    blast: function (id) { return Store.data.bestBlast[id || Store.data.tier] || 0; },
    rank: function (id) { return Store.data.bestRank[id || Store.data.tier] || 0; },

    load: function (done) {
      var IDS = ['cruise', 'drive', 'redline'];
      var copyNums = function (src, dst) {
        if (!src) return;
        IDS.forEach(function (k) { if (typeof src[k] === 'number') dst[k] = src[k]; });
      };
      var finish = function (obj) {
        if (obj && typeof obj === 'object') {
          copyNums(obj.bests, Store.data.bests);
          copyNums(obj.bestBlast, Store.data.bestBlast);
          copyNums(obj.bestRank, Store.data.bestRank);
          if (typeof obj.tier === 'string' && tierById(obj.tier).id === obj.tier) Store.data.tier = obj.tier;
          if (typeof obj.runs === 'number') Store.data.runs = obj.runs;
          if (typeof obj.muted === 'boolean') Store.data.muted = obj.muted;
          if (typeof obj.quickDeaths === 'number') Store.data.quickDeaths = obj.quickDeaths;
          if (typeof obj.offeredDown === 'boolean') Store.data.offeredDown = obj.offeredDown;
          if (typeof obj.offeredUp === 'boolean') Store.data.offeredUp = obj.offeredUp;
        }
        done();
      };
      if (YT && YT.game && YT.game.loadData) {
        var settled = false;
        var timer = setTimeout(function () { if (!settled) { settled = true; finish(null); } }, 2500);
        try {
          YT.game.loadData().then(function (raw) {
            if (settled) return; settled = true; clearTimeout(timer);
            var o = null; try { o = JSON.parse(raw || '{}'); } catch (e) {}
            finish(o);
          })['catch'](function () {
            if (settled) return; settled = true; clearTimeout(timer); finish(null);
          });
          return;
        } catch (e) { if (!settled) { settled = true; clearTimeout(timer); } }
      }
      var local = null;
      try { local = JSON.parse(window.localStorage.getItem(SAVE_KEY) || '{}'); } catch (e) {}
      finish(local);
    },

    save: function () {
      var raw = JSON.stringify(Store.data);
      if (YT && YT.game && YT.game.saveData) {
        try { YT.game.saveData(raw)['catch'](function () {}); return; } catch (e) {}
      }
      try { window.localStorage.setItem(SAVE_KEY, raw); } catch (e) {}
    }
  };




  /* =========================================================================
     3. AUDIO — a small electrical orchestra. No files.
     ========================================================================= */
  var Sound = {
    ctx: null, master: null, noiseBuf: null, started: false, muted: false,
    humOsc: null, humGain: null,

    boot: function () {
      if (this.ctx) return;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { return; }
      var ctx = this.ctx;
      this.master = ctx.createGain();
      this.master.gain.value = 0;
      this.master.connect(ctx.destination);

      var len = Math.floor(ctx.sampleRate * 1.6);
      var buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var ch = buf.getChannelData(0);
      for (var i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;

      // Mains hum, quiet, rising as the board fills. It is the clock you feel
      // before you look at it.
      var o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 50;
      var o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 100;
      var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320;
      var g = ctx.createGain(); g.gain.value = 0;
      o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(this.master);
      o.start(0); o2.start(0);
      this.humOsc = [o, o2]; this.humGain = g;

      this.started = true;
      this.applyVolume();
    },

    resumeCtx: function () {
      if (this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
    },
    applyVolume: function () {
      if (!this.master) return;
      var on = !this.muted && Platform.audioAllowed;
      try { this.master.gain.setTargetAtTime(on ? 0.85 : 0.0, this.ctx.currentTime, 0.02); } catch (e) {}
    },
    hardStop: function () {
      if (!this.master) return;
      try {
        this.master.gain.setValueAtTime(0, this.ctx.currentTime);
        this.humGain.gain.setValueAtTime(0, this.ctx.currentTime);
      } catch (e) {}
    },
    hum: function (level) {
      if (!this.started) return;
      try { this.humGain.gain.setTargetAtTime(0.012 + level * 0.055, this.ctx.currentTime, 0.3); } catch (e) {}
    },

    blip: function (freq, dur, type, vol, delay) {
      if (!this.started) return null;
      var ctx = this.ctx, t = ctx.currentTime + (delay || 0);
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol == null ? 0.2 : vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.03);
      return o;
    },

    noise: function (dur, f0, f1, vol, type, q) {
      if (!this.started) return;
      var ctx = this.ctx, t = ctx.currentTime;
      var s = ctx.createBufferSource(); s.buffer = this.noiseBuf;
      var bp = ctx.createBiquadFilter(); bp.type = type || 'bandpass';
      bp.frequency.setValueAtTime(f0, t);
      bp.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
      bp.Q.value = q == null ? 1 : q;
      var g = ctx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(bp); bp.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur + 0.03);
    },

    ui: function () { this.blip(587.33, 0.08, 'triangle', 0.12); },
    land: function () { this.blip(180, 0.09, 'triangle', 0.16); this.noise(0.07, 900, 300, 0.07); },
    full: function () { this.blip(150, 0.18, 'square', 0.12); },

    // Merge: pitch climbs with the rank made, so growth is audible.
    merge: function (rank) {
      var base = 392 * Math.pow(1.0595, Math.min(rank, 7) * 3);
      this.blip(base, 0.2, 'triangle', 0.18);
      this.blip(base * 1.5, 0.16, 'sine', 0.1, 0.04);
    },

    // A detonation. Bigger chains are lower, longer and rougher.
    blast: function (size, chain) {
      if (!this.started) return;
      var f = 240 - Math.min(size, 12) * 9;
      this.blip(f, 0.4 + size * 0.02, 'sawtooth', 0.22);
      this.blip(f * 0.5, 0.55, 'sine', 0.2, 0.02);
      this.noise(0.35 + size * 0.02, 2600, 200, 0.2, 'bandpass', 0.8);
      for (var i = 0; i < Math.min(chain, 4); i++) {
        this.blip(523.25 * Math.pow(1.26, i), 0.26, 'triangle', 0.12, 0.07 + i * 0.07);
      }
    },

    rise: function () { this.noise(0.3, 240, 900, 0.12, 'bandpass', 1.4); this.blip(98, 0.3, 'square', 0.1); },

    vent: function () {
      this.blip(147, 0.6, 'square', 0.2);
      this.blip(110, 0.75, 'sine', 0.22, 0.05);
      this.noise(0.6, 1800, 160, 0.2, 'lowpass', 1);
    },

    fuseWon: function () {
      var N = [523.25, 659.25, 783.99, 1046.5];
      for (var i = 0; i < N.length; i++) this.blip(N[i], 0.36, 'triangle', 0.15, i * 0.065);
    },

    over: function () {
      this.hum(0);
      this.blip(261.63, 0.9, 'sine', 0.2);
      this.blip(196.00, 1.1, 'sine', 0.19, 0.1);
      this.blip(130.81, 1.4, 'sine', 0.17, 0.24);
    }
  };

  /* =========================================================================
     4. TUNING

     Two rules, and the second is the game:

       MERGE     dropping a cell fuses the connected run of the SAME RANK it
                 lands in — all of it, however big — into one cell a rank
                 higher. The new cell keeps the charge if every cell that went
                 into it agreed; if any two disagreed, it comes out dead.

                 A merge has to be TRIGGERED. Rows arriving from the floor sit
                 where they land, however much they match. The first version
                 merged any same-rank run the moment it existed, and the two
                 opening rows — ten rank-one cells, all connected — collapsed
                 into a single cell before the player had touched anything. The
                 board could never fill and no run could ever end.

       DETONATE  a cell that comes out of a merge still charged looks at the
                 connected run of its own charge. Four or more, and the whole
                 run goes.

     So merging is how you grow and also how you ruin a charge, and the thing
     you are really arranging is not rank — it is agreement.
     ========================================================================= */
  var LOGICAL_H  = 960;
  var COLS       = 5;
  var ROWS       = 8;
  var CELL       = 76;
  var BOARD_W    = COLS * CELL;
  var BOARD_H    = ROWS * CELL;
  var BOARD_TOP  = 238;
  var BOARD_BOT  = BOARD_TOP + BOARD_H;
  var MAX_RANK   = 7;
  var BLAST_MIN  = 4;        // charged cells in a run that make it go
  var DROP_ACC   = 5200;     // fall acceleration, units/s^2
  var POP_TIME   = 0.28;
  var RISE_TIME  = 0.34;
  var BLAST_FOR_FUSE = 7;    // a run this big buys a fuse back

  /* -------------------------------------------------------------------------
     Difficulty is one measured number: the CLEAR BUDGET — how many cells you
     have to be getting rid of, just to stay level with the floor.

         budget = COLS / rise interval

     The floor comes up on a timer AND every so many drops, whichever arrives
     first. The second half of that is not decoration. With the floor on a
     clock alone, dropping faster is free: every drop is a chance to merge, a
     merge of three or more is a net clear, and an auto-operator tapping twice
     a second held an almost empty board for two minutes without trying. Tying
     the floor to drops as well means speed buys you nothing — what you drop
     and where is the only thing left to be good at.

     Nothing about the input changes between tiers — one tap, same column, same
     drop. The board, the cells and the queue are fixed logical sizes.
     ------------------------------------------------------------------------- */
  var TIERS = [
    { id: 'cruise', name: 'Cruise', blurb: 'Time to think',
      rise: 9.0, riseMin: 6.0, riseRamp: 0.0045, riseDrops: 8,
      bias: 0.72, deadRate: 0.05,
      fuses: 4, maxFuses: 6, scoreMul: 0.7 },
    { id: 'drive', name: 'Drive', blurb: 'The real thing',
      rise: 6.5, riseMin: 4.2, riseRamp: 0.0055, riseDrops: 6,
      bias: 0.58, deadRate: 0.10,
      fuses: 3, maxFuses: 5, scoreMul: 1.0 },
    { id: 'redline', name: 'Redline', blurb: 'Hold the line',
      rise: 5.0, riseMin: 3.2, riseRamp: 0.0065, riseDrops: 5,
      bias: 0.46, deadRate: 0.16,
      fuses: 2, maxFuses: 4, scoreMul: 1.45 }
  ];

  function budgetOf(T) { return COLS / T.rise; }

  // Both halves of the floor tighten as a run goes on, or a player good enough
  // to hold the line holds it for ever — which an earlier game in this
  // portfolio shipped once and the run-length probe caught.
  function dropsPerRise() {
    return Math.max(3, S.tier.riseDrops - Math.floor(S.time / 45));
  }

  function tierById(id) {
    for (var i = 0; i < TIERS.length; i++) if (TIERS[i].id === id) return TIERS[i];
    return TIERS[1];
  }
  function tierIndex(id) {
    for (var i = 0; i < TIERS.length; i++) if (TIERS[i].id === id) return i;
    return 1;
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function rndi(a, b) { return Math.floor(rnd(a, b + 1)); }
  function fmt(n) { return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  function roundRect(c, x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  /* =========================================================================
     5. VIEW / SPRITE CACHE
     ========================================================================= */
  var app = document.getElementById('app');
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: false });

  var view = { w: 540, h: LOGICAL_H, scale: 1, dpr: 1 };
  var sprites = {};
  var spriteQ = 2;
  var bgFull = null;

  function sprite(key, w, h, paint) {
    var k = key + '|' + Math.round(w) + 'x' + Math.round(h) + '@' + spriteQ;
    var hit = sprites[k];
    if (hit) return hit;
    var cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.ceil(w * spriteQ));
    cv.height = Math.max(1, Math.ceil(h * spriteQ));
    var c2 = cv.getContext('2d');
    c2.setTransform(spriteQ, 0, 0, spriteQ, 0, 0);
    paint(c2, w, h);
    hit = { cv: cv, w: w, h: h };
    sprites[k] = hit;
    return hit;
  }

  function blit(s, cx, cy) { ctx.drawImage(s.cv, cx - s.w / 2, cy - s.h / 2, s.w, s.h); }

  function layout() {
    var cw = Math.max(1, app.clientWidth || window.innerWidth);
    var chh = Math.max(1, app.clientHeight || window.innerHeight);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);

    // Past this many device pixels, drop resolution rather than frames.
    var budget = 2.6e6;
    var pxCount = cw * chh * dpr * dpr;
    if (pxCount > budget) dpr = Math.max(1, dpr * Math.sqrt(budget / pxCount));

    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(chh * dpr);
    canvas.style.width = cw + 'px';
    canvas.style.height = chh + 'px';

    view.dpr = dpr;
    view.scale = chh / LOGICAL_H;
    view.h = LOGICAL_H;
    view.w = cw / view.scale;

    ctx.setTransform(dpr * view.scale, 0, 0, dpr * view.scale, 0, 0);
    spriteQ = clamp(view.scale * view.dpr, 1, 2.5);
    sprites = {};
    bgFull = null;
  }

  function boardX0() { return (view.w - BOARD_W) / 2; }
  function cellX(c) { return boardX0() + c * CELL + CELL / 2; }
  function cellY(r) { return BOARD_TOP + r * CELL + CELL / 2; }

  /* -------------------------------------------------------------------------
     The cabinet the board sits in never changes, so it is painted once per
     layout at real canvas resolution and blitted 1:1. Stretching a small
     texture over the screen every frame costs per destination pixel, and that
     was the whole 30-versus-60 fps gap in an earlier game in this portfolio.
     ------------------------------------------------------------------------- */
  function backgroundFull() {
    if (bgFull && bgFull.width === canvas.width && bgFull.height === canvas.height) return bgFull;
    var cv = document.createElement('canvas');
    cv.width = Math.max(1, canvas.width);
    cv.height = Math.max(1, canvas.height);
    var c = cv.getContext('2d');
    c.setTransform(view.dpr * view.scale, 0, 0, view.dpr * view.scale, 0, 0);

    var W = view.w, H = view.h, X0 = boardX0();

    var back = c.createLinearGradient(0, 0, 0, H);
    back.addColorStop(0, '#f2f4fd');
    back.addColorStop(0.55, '#e4e8f8');
    back.addColorStop(1, '#d4daf0');
    c.fillStyle = back;
    c.fillRect(0, 0, W, H);

    // Circuit traces on the panel either side, where there is room for them.
    if (X0 > 40) {
      var R = 987654321;
      var rr = function () { R = (R * 1664525 + 1013904223) >>> 0; return R / 4294967296; };
      c.lineCap = 'round'; c.lineJoin = 'round';
      for (var i = 0; i < 34; i++) {
        var left = rr() < 0.5;
        var sxp = left ? rr() * Math.max(10, X0 - 30) : X0 + BOARD_W + 20 + rr() * Math.max(10, W - X0 - BOARD_W - 40);
        var syp = rr() * H;
        c.strokeStyle = rr() < 0.5 ? 'rgba(122,108,240,.16)' : 'rgba(79,92,143,.16)';
        c.lineWidth = 3 + rr() * 3;
        c.beginPath();
        c.moveTo(sxp, syp);
        var px = sxp, py = syp;
        for (var seg = 0; seg < 3; seg++) {
          var horiz = rr() < 0.5;
          var d = (rr() < 0.5 ? -1 : 1) * (30 + rr() * 90);
          if (horiz) px += d; else py += d;
          c.lineTo(px, py);
        }
        c.stroke();
        c.fillStyle = 'rgba(79,92,143,.22)';
        c.beginPath(); c.arc(px, py, 5, 0, Math.PI * 2); c.fill();
      }
    }

    // The board well.
    c.fillStyle = '#2a3352';
    roundRect(c, X0 - 10, BOARD_TOP - 10, BOARD_W + 20, BOARD_H + 20, 20);
    c.fill();
    c.fillStyle = '#222a44';
    roundRect(c, X0, BOARD_TOP, BOARD_W, BOARD_H, 12);
    c.fill();

    // Cell wells, so an empty column still reads as a column.
    c.fillStyle = 'rgba(255,255,255,.045)';
    for (var r2 = 0; r2 < ROWS; r2++) {
      for (var c2 = 0; c2 < COLS; c2++) {
        roundRect(c, X0 + c2 * CELL + 5, BOARD_TOP + r2 * CELL + 5, CELL - 10, CELL - 10, 12);
        c.fill();
      }
    }

    // The top two rows are the vent zone: fill them and you lose a fuse.
    c.strokeStyle = 'rgba(255,148,48,.4)';
    c.lineWidth = 3;
    c.setLineDash([10, 8]);
    c.beginPath();
    c.moveTo(X0 + 6, BOARD_TOP + CELL * 2);
    c.lineTo(X0 + BOARD_W - 6, BOARD_TOP + CELL * 2);
    c.stroke();
    c.setLineDash([]);

    bgFull = cv;
    return cv;
  }

  /* =========================================================================
     6. RUN STATE
     ========================================================================= */
  var nextId = 1;

  var S = {
    mode: 'menu', tier: TIERS[1],
    grid: [], queue: [],
    phase: 'idle',            // idle | falling | settle
    fall: null, settleT: 0,
    popping: [], spawnAfter: [], fresh: [], trigger: [],

    fuses: 3, maxFuses: 5, fusesWon: 0, vents: 0,
    score: 0, merges: 0, blasts: 0, bestBlast: 0, bestRank: 1, cleared: 0,
    chain: 0, bestChain: 0,

    riseT: 0, riseShift: 0, drops: 0, sinceRise: 0,
    particles: [], floats: [],
    shake: 0, flash: 0, flashCol: '255,255,255',
    toastT: 0, toastMsg: '', toastSub: '',
    deathT: 0, time: 0
  };

  var overTitleText = 'Burnt Out';

  function emptyGrid() {
    var g = [];
    for (var r = 0; r < ROWS; r++) { g.push([]); for (var c = 0; c < COLS; c++) g[r].push(null); }
    return g;
  }

  function resetRun() {
    var T = tierById(Store.data.tier);
    S.tier = T;
    S.mode = 'menu';
    S.grid = emptyGrid();
    S.queue.length = 0;
    S.phase = 'idle'; S.fall = null; S.settleT = 0;
    S.popping.length = 0; S.spawnAfter.length = 0; S.fresh.length = 0; S.trigger.length = 0;
    S.fuses = T.fuses; S.maxFuses = T.maxFuses; S.fusesWon = 0; S.vents = 0;
    S.score = 0; S.merges = 0; S.blasts = 0; S.bestBlast = 0; S.bestRank = 1; S.cleared = 0;
    S.chain = 0; S.bestChain = 0;
    S.riseT = T.rise; S.riseShift = 0; S.drops = 0; S.sinceRise = 0;
    S.particles.length = 0; S.floats.length = 0;
    S.shake = 0; S.flash = 0;
    S.toastT = 0; S.deathT = 0; S.time = 0;
    for (var i = 0; i < 3; i++) S.queue.push(newPiece());
    // Two rows to start, so the first tap has something to do.
    for (var k = 0; k < 2; k++) pushRow(true);
  }

  function toast(msg, sub) { S.toastMsg = msg; S.toastSub = sub || ''; S.toastT = 2.8; }

  function floatText(x, y, text, col, size) {
    S.floats.push({ x: x, y: y, text: text, col: col, size: size || 26, life: 1.2, max: 1.2 });
  }

  function burst(x, y, col, n, spread, speed) {
    for (var i = 0; i < n; i++) {
      var a = rnd(0, Math.PI * 2), sp = rnd(speed * 0.3, speed);
      S.particles.push({
        x: x + rnd(-spread, spread), y: y + rnd(-spread, spread),
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: rnd(0.3, 0.8), max: 0.8, r: rnd(2.5, 6), col: col
      });
    }
  }

  /* =========================================================================
     7. PIECES AND THE BOARD
     ========================================================================= */
  function majorityCharge() {
    var p = 0, n = 0;
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
      var g = S.grid[r][c];
      if (!g) continue;
      if (g.charge > 0) p++; else if (g.charge < 0) n++;
    }
    if (p === n) return Math.random() < 0.5 ? 1 : -1;
    return p > n ? 1 : -1;
  }

  function newPiece(rank) {
    var T = S.tier, ch;
    if (Math.random() < T.deadRate) ch = 0;
    else {
      var maj = majorityCharge();
      ch = Math.random() < T.bias ? maj : -maj;
    }
    return { id: nextId++, rank: rank || 1, charge: ch, pop: 0, born: S.time };
  }

  function colTop(c) {
    for (var r = 0; r < ROWS; r++) if (S.grid[r][c]) return r;
    return ROWS;
  }

  function landingRow(c) { return colTop(c) - 1; }

  // A fresh row shoved in at the bottom, everything else pushed up a place.
  function pushRow(silent) {
    for (var c = 0; c < COLS; c++) {
      if (S.grid[0][c]) { vent(); return false; }
    }
    for (var r = 0; r < ROWS - 1; r++) S.grid[r] = S.grid[r + 1];
    S.grid[ROWS - 1] = [];
    /* A mixed row, not a row of ones. All-rank-one rows hand the player one
       enormous connected region to wipe with a single drop, and the board
       empties faster than the floor can fill it. */
    for (var c2 = 0; c2 < COLS; c2++) {
      var rr = Math.random();
      S.grid[ROWS - 1].push(newPiece(rr < 0.45 ? 1 : (rr < 0.80 ? 2 : 3)));
    }
    S.riseShift = 1;
    S.trigger.length = 0;
    if (!silent) { Sound.rise(); S.phase = 'settle'; S.settleT = 0.12; }
    return true;
  }

  /* The vent: the top of the cabinet blows, two rows go with it, and it costs a
     fuse. A fuse comes back only from a run of seven or more, so the way to
     buy safety is to build a bigger chain, never to play smaller. */
  function vent() {
    S.vents++;
    S.fuses--;
    S.shake = 20;
    S.flash = 0.55; S.flashCol = '255,148,48';
    Sound.vent();
    for (var r = 0; r < 2; r++) for (var c = 0; c < COLS; c++) {
      if (S.grid[r][c]) {
        burst(cellX(c), cellY(r), '#ff9430', 8, 16, 260);
        S.grid[r][c] = null;
      }
    }
    if (S.fuses <= 0) { gameOver('Burnt Out'); return; }
    floatText(view.w / 2, BOARD_TOP + 70, S.fuses + ' FUSES LEFT', '#ff9430', 26);
    S.phase = 'settle'; S.settleT = 0.15;
  }

  function gameOver(title) {
    overTitleText = title || 'Burnt Out';
    S.mode = 'dead';
    S.deathT = 1.2;
    Sound.hum(0);
    Sound.over();
  }

  // Connected run of cells passing `same`, starting at (r,c).
  function flood(r0, c0, same, seen) {
    var out = [], stack = [[r0, c0]];
    seen[r0 * COLS + c0] = 1;
    while (stack.length) {
      var p = stack.pop();
      out.push(p);
      var d = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (var i = 0; i < 4; i++) {
        var r = p[0] + d[i][0], c = p[1] + d[i][1];
        if (r < 0 || c < 0 || r >= ROWS || c >= COLS) continue;
        if (seen[r * COLS + c]) continue;
        if (!S.grid[r][c]) continue;
        if (!same(S.grid[r0][c0], S.grid[r][c])) continue;
        seen[r * COLS + c] = 1;
        stack.push([r, c]);
      }
    }
    return out;
  }

  // Only a cell that was just put there, just made, or just fell can start a
  // merge. Everything else is board, and board does not fuse itself.
  function findMerges() {
    var seen = {}, groups = [];
    for (var i = 0; i < S.trigger.length; i++) {
      var t = S.trigger[i];
      if (t.r < 0 || t.c < 0 || t.r >= ROWS || t.c >= COLS) continue;
      if (!S.grid[t.r][t.c] || seen[t.r * COLS + t.c]) continue;
      var g = flood(t.r, t.c, function (a, b) { return a.rank === b.rank; }, seen);
      if (g.length >= 2) groups.push(g);
    }
    return groups;
  }

  function findBlasts() {
    // Only a cell that just came out of a merge, still charged, looks around.
    var out = [], seen = {};
    for (var i = 0; i < S.fresh.length; i++) {
      var f = S.fresh[i];
      var cell = S.grid[f.r] && S.grid[f.r][f.c];
      if (!cell || cell.charge === 0) continue;
      if (seen[f.r * COLS + f.c]) continue;
      var g = flood(f.r, f.c, function (a, b) { return a.charge === b.charge && b.charge !== 0; }, seen);
      if (g.length >= BLAST_MIN) out.push(g);
    }
    return out;
  }

  // Returns where everything that moved ended up, because a cell that has just
  // fallen into a new neighbourhood gets to fuse with it.
  function applyGravity() {
    var moved = [];
    for (var c = 0; c < COLS; c++) {
      var write = ROWS - 1;
      for (var r = ROWS - 1; r >= 0; r--) {
        if (!S.grid[r][c]) continue;
        if (r !== write) {
          S.grid[write][c] = S.grid[r][c];
          S.grid[r][c] = null;
          moved.push({ r: write, c: c });
        }
        write--;
      }
    }
    return moved;
  }

  /* -------------------------------------------------------------------------
     One transformation per call, with a pause after it, so a cascade is
     something you watch rather than something that has already happened.
     ------------------------------------------------------------------------- */
  function settleStep() {
    var i, T = S.tier;

    if (S.popping.length) {
      for (i = 0; i < S.popping.length; i++) {
        var p = S.popping[i];
        if (S.grid[p.r][p.c] && S.grid[p.r][p.c].id === p.id) S.grid[p.r][p.c] = null;
      }
      S.popping.length = 0;
      S.fresh.length = 0;
      for (i = 0; i < S.spawnAfter.length; i++) {
        var s = S.spawnAfter[i];
        S.grid[s.r][s.c] = { id: nextId++, rank: s.rank, charge: s.charge, pop: -1, born: S.time };
        S.fresh.push({ r: s.r, c: s.c });
      }
      S.spawnAfter.length = 0;
      var moved = applyGravity();
      // Gravity moves the new cells, so they are found again by their flag.
      S.fresh = freshPositions();
      S.trigger = S.fresh.concat(moved);
      return 0.07;
    }

    var blasts = findBlasts();
    if (blasts.length) {
      S.chain++;
      if (S.chain > S.bestChain) S.bestChain = S.chain;
      for (i = 0; i < blasts.length; i++) {
        var g = blasts[i], sum = 0, cx2 = 0, cy2 = 0;
        var charge = S.grid[g[0][0]][g[0][1]].charge;
        for (var j = 0; j < g.length; j++) {
          var cell = S.grid[g[j][0]][g[j][1]];
          sum += cell.rank;
          cx2 += cellX(g[j][1]); cy2 += cellY(g[j][0]);
          S.popping.push({ r: g[j][0], c: g[j][1], id: cell.id });
          cell.pop = POP_TIME;
          burst(cellX(g[j][1]), cellY(g[j][0]), charge > 0 ? '#ffb45e' : '#78b0ff', 12, 18, 340);
        }
        cx2 /= g.length; cy2 /= g.length;
        var gain = Math.round(sum * g.length * 10 * (1 + 0.5 * (S.chain - 1)) * T.scoreMul);
        S.score += gain;
        S.blasts++;
        S.cleared += g.length;
        if (g.length > S.bestBlast) S.bestBlast = g.length;
        Sound.blast(g.length, S.chain);
        S.shake = Math.max(S.shake, 6 + g.length);
        floatText(cx2, cy2 - 10, '+' + fmt(gain), charge > 0 ? '#ff9430' : '#4d8ff0', 28);
        if (S.chain > 1) floatText(cx2, cy2 + 24, 'CHAIN ×' + S.chain, '#7a6cf0', 20);
        if (g.length >= BLAST_FOR_FUSE && S.fuses < S.maxFuses) {
          S.fuses++; S.fusesWon++;
          Sound.fuseWon();
          floatText(view.w / 2, BOARD_TOP - 26, '+FUSE', '#2fa36a', 24);
        }
      }
      return POP_TIME;
    }

    // Nothing blew up, so the merge flags have done their job and come off.
    // Leaving them on lets a later cascade re-test a cell that was never part
    // of it, which is a rule the player cannot see and would not believe.
    for (i = 0; i < S.fresh.length; i++) {
      var fc = S.grid[S.fresh[i].r][S.fresh[i].c];
      if (fc && fc.pop === -1) fc.pop = 0;
    }
    S.fresh.length = 0;

    var groups = findMerges();
    if (groups.length) {
      for (i = 0; i < groups.length; i++) {
        var grp = groups[i];
        var rank = S.grid[grp[0][0]][grp[0][1]].rank;
        // Where it lands: lowest row, then leftmost, so a merge falls into the
        // stack rather than floating on top of it.
        var tr = -1, tc = -1;
        for (var k = 0; k < grp.length; k++) {
          if (grp[k][0] > tr || (grp[k][0] === tr && grp[k][1] < tc)) { tr = grp[k][0]; tc = grp[k][1]; }
        }
        var ch = S.grid[grp[0][0]][grp[0][1]].charge, unanimous = true, sumRank = 0;
        for (var m = 0; m < grp.length; m++) {
          var cl = S.grid[grp[m][0]][grp[m][1]];
          sumRank += cl.rank;
          if (cl.charge !== ch) unanimous = false;
          S.popping.push({ r: grp[m][0], c: grp[m][1], id: cl.id });
          cl.pop = POP_TIME;
        }
        if (rank >= MAX_RANK) {
          // Nowhere left to grow: the whole group goes up instead.
          var gain2 = Math.round(sumRank * grp.length * 16 * S.tier.scoreMul);
          S.score += gain2;
          S.cleared += grp.length;
          Sound.blast(grp.length, 1);
          S.shake = Math.max(S.shake, 16);
          floatText(cellX(tc), cellY(tr), 'MELTDOWN +' + fmt(gain2), '#ff5e5e', 26);
          burst(cellX(tc), cellY(tr), '#ff8a5e', 26, 22, 420);
        } else {
          S.spawnAfter.push({ r: tr, c: tc, rank: rank + 1, charge: unanimous ? ch : 0 });
          S.merges++;
          if (rank + 1 > S.bestRank) S.bestRank = rank + 1;
          var gain3 = Math.round((rank + 1) * (rank + 1) * 6 * S.tier.scoreMul);
          S.score += gain3;
          Sound.merge(rank + 1);
          if (!unanimous) floatText(cellX(tc), cellY(tr) - 18, 'DEAD', '#8e97ad', 20);
        }
      }
      return POP_TIME;
    }

    S.chain = 0;
    S.fresh.length = 0;
    S.trigger.length = 0;
    S.phase = 'idle';
    return 0;
  }

  function freshPositions() {
    // After gravity the merged cells have moved; a cell with pop === -1 is one.
    var out = [];
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
      var g = S.grid[r][c];
      if (g && g.pop === -1) { out.push({ r: r, c: c }); }
    }
    return out;
  }

  /* =========================================================================
     8. INPUT — one tap on a column. Identical on every tier.
     ========================================================================= */
  function localPoint(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / view.scale, y: (e.clientY - r.top) / view.scale };
  }

  function dropInto(c) {
    if (S.mode !== 'play' || S.phase !== 'idle') return false;
    if (c < 0 || c >= COLS) return false;
    var row = landingRow(c);
    if (row < 0) { Sound.full(); S.shake = Math.max(S.shake, 5); return false; }
    var piece = S.queue.shift();
    S.queue.push(newPiece());
    S.fall = { col: c, row: row, piece: piece, y: BOARD_TOP - CELL * 0.5, vy: 260 };
    S.phase = 'falling';
    S.drops++;
    S.sinceRise++;
    return true;
  }

  app.addEventListener('pointerdown', function (e) {
    if (e.target && e.target.closest && e.target.closest('#sysbar')) return;
    e.preventDefault();
    Sound.boot(); Sound.resumeCtx();
    if (S.mode !== 'play') return;
    var p = localPoint(e);
    dropInto(Math.floor((p.x - boardX0()) / CELL));
  }, { passive: false });

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'Escape' || k === 'p' || k === 'P') {
      e.preventDefault();
      if (S.mode === 'play') pauseGame(); else if (S.mode === 'paused') resumeGame();
      return;
    }
    if (k === 'm' || k === 'M') { e.preventDefault(); Sound.boot(); Sound.resumeCtx(); toggleMute(); return; }
    if (k >= '1' && k <= '5') { e.preventDefault(); dropInto(+k - 1); }
  });

  /* =========================================================================
     9. UPDATE
     ========================================================================= */
  function fillLevel() {
    var used = 0;
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) if (S.grid[r][c]) used++;
    return used / (ROWS * COLS);
  }

  function update(dt) {
    updateFx(dt);

    if (S.mode === 'dead') {
      S.deathT -= dt;
      if (S.deathT <= 0 && !gameOverShown) showGameOver();
      return;
    }
    if (S.mode !== 'play') return;

    S.time += dt;
    var T = S.tier;
    Sound.hum(fillLevel());

    if (S.phase === 'falling' && S.fall) {
      S.fall.vy += DROP_ACC * dt;
      S.fall.y += S.fall.vy * dt;
      var target = cellY(S.fall.row);
      if (S.fall.y >= target) {
        S.grid[S.fall.row][S.fall.col] = S.fall.piece;
        S.trigger = [{ r: S.fall.row, c: S.fall.col }];
        S.fall = null;
        Sound.land();
        S.phase = 'settle';
        S.settleT = 0.06;
      }
    } else if (S.phase === 'settle') {
      S.settleT -= dt;
      if (S.settleT <= 0) S.settleT = settleStep();
    }

    // The floor only comes up between moves, so a rise never lands on top of a
    // cascade the player is still reading.
    var riseEvery = Math.max(T.riseMin, T.rise * (1 - S.time * T.riseRamp));
    var riseDrops = dropsPerRise();
    S.riseT -= dt;
    if ((S.riseT <= 0 || S.sinceRise >= riseDrops) && S.phase === 'idle') {
      S.riseT = riseEvery;
      S.sinceRise = 0;
      pushRow(false);
    }
  }

  /* Screen effects decay on real time and in every mode, so a run that ends on
     a flash does not leave the flash painted on forever. That bug shipped once
     in this portfolio; it does not ship again. */
  function updateFx(dt) {
    S.shake *= Math.pow(0.0016, dt);
    if (S.shake < 0.05) S.shake = 0;
    S.flash = Math.max(0, S.flash - dt * 2.1);
    S.riseShift = Math.max(0, S.riseShift - dt / RISE_TIME);
    if (S.toastT > 0) S.toastT -= dt;

    var i, r, c;
    for (r = 0; r < ROWS; r++) for (c = 0; c < COLS; c++) {
      var g = S.grid[r][c];
      if (g && g.pop > 0) g.pop = Math.max(0, g.pop - dt);
      if (g && g.pop === -1 && S.time - g.born > 0.35) g.pop = 0;
    }
    for (i = S.particles.length - 1; i >= 0; i--) {
      var p = S.particles[i];
      p.life -= dt;
      if (p.life <= 0) { S.particles.splice(i, 1); continue; }
      p.vy += 900 * dt;
      p.vx *= Math.pow(0.3, dt);
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (i = S.floats.length - 1; i >= 0; i--) {
      var f = S.floats[i];
      f.life -= dt;
      if (f.life <= 0) { S.floats.splice(i, 1); continue; }
      f.y -= 46 * dt;
    }
  }

  /* =========================================================================
     10. RENDER
     ========================================================================= */
  var FONT = ' system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

  function label(text, x, y, size, col, align, stroke) {
    ctx.font = '900 ' + size + 'px' + FONT;
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    if (stroke) {
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(3, size * 0.16);
      ctx.strokeStyle = stroke;
      ctx.strokeText(text, x, y);
    }
    ctx.fillStyle = col;
    ctx.fillText(text, x, y);
  }

  var SKIN = {
    '1': { a: '#ffb45e', b: '#ff8a1e', rim: '#c2600a', ink: '#54280a' },
    '-1': { a: '#78b0ff', b: '#3f7fe8', rim: '#1d4f9e', ink: '#0e2murk' },
    '0': { a: '#b6bdd0', b: '#8e97ad', rim: '#5c6478', ink: '#2c3242' }
  };
  SKIN['-1'].ink = '#0e2450';

  /* A cell says two things at once: how strong it is, and which way it is
     charged. Rank is a ring of that many segments — countable at a glance up to
     seven, which numbers on a tile are not. Charge is colour AND a glyph, so it
     survives colour blindness and a bright phone in the sun. */
  function cellSprite(rank, charge) {
    var key = 'cell|' + rank + '|' + charge;
    return sprite(key, CELL, CELL, function (c, w, h) {
      var S1 = SKIN[String(charge)];
      var pad = 5, r = 14;
      var g = c.createLinearGradient(pad, pad, w - pad, h - pad);
      g.addColorStop(0, S1.a); g.addColorStop(1, S1.b);
      roundRect(c, pad, pad, w - pad * 2, h - pad * 2, r);
      c.fillStyle = g; c.fill();
      c.strokeStyle = S1.rim; c.lineWidth = 3; c.stroke();
      c.fillStyle = 'rgba(255,255,255,.28)';
      roundRect(c, pad + 4, pad + 4, w - pad * 2 - 8, (h - pad * 2) * 0.32, 9); c.fill();

      // Rank ring.
      var cx = w / 2, cy = h / 2, rr = w * 0.29;
      c.lineCap = 'round';
      c.lineWidth = 5;
      for (var i = 0; i < rank; i++) {
        var a0 = -Math.PI / 2 + (i / rank) * Math.PI * 2 + 0.16;
        var a1 = -Math.PI / 2 + ((i + 1) / rank) * Math.PI * 2 - 0.16;
        c.strokeStyle = 'rgba(255,255,255,.92)';
        c.beginPath(); c.arc(cx, cy, rr, a0, a1); c.stroke();
      }

      // Charge glyph.
      c.strokeStyle = S1.ink; c.lineWidth = 5.5; c.lineCap = 'round';
      if (charge > 0) {
        c.beginPath(); c.moveTo(cx - 9, cy); c.lineTo(cx + 9, cy);
        c.moveTo(cx, cy - 9); c.lineTo(cx, cy + 9); c.stroke();
      } else if (charge < 0) {
        c.beginPath(); c.moveTo(cx - 9, cy); c.lineTo(cx + 9, cy); c.stroke();
      } else {
        c.fillStyle = S1.ink;
        c.beginPath(); c.arc(cx, cy, 4.5, 0, Math.PI * 2); c.fill();
      }
    });
  }

  function render() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(backgroundFull(), 0, 0);
    ctx.restore();

    var sx = 0, sy = 0;
    if (S.shake > 0.1) { sx = rnd(-S.shake, S.shake); sy = rnd(-S.shake * 0.6, S.shake * 0.6); }
    ctx.save();
    ctx.translate(sx, sy);

    drawBoard();
    drawFalling();
    drawParticles();

    ctx.restore();

    drawHud();
    drawFloats();
    drawToast();

    if (S.flash > 0.001) {
      ctx.fillStyle = 'rgba(' + S.flashCol + ',' + (S.flash * 0.42).toFixed(3) + ')';
      ctx.fillRect(0, 0, view.w, view.h);
    }
  }

  function drawBoard() {
    var lift = S.riseShift * CELL;
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var g = S.grid[r][c];
        if (!g) continue;
        var x = cellX(c), y = cellY(r) + lift;
        var k = 1, a = 1;
        if (g.pop > 0) { k = 1 + (1 - g.pop / POP_TIME) * 0.42; a = g.pop / POP_TIME; }
        else if (g.pop === -1) {
          var t = clamp((S.time - g.born) / 0.22, 0, 1);
          k = 1 + Math.sin(t * Math.PI) * 0.22;
        }
        ctx.save();
        ctx.globalAlpha = a;
        ctx.translate(x, y);
        ctx.scale(k, k);
        blit(cellSprite(g.rank, g.charge), 0, 0);
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawFalling() {
    if (!S.fall) return;
    var f = S.fall;
    // A guide down the column, so the tap that started this reads as a choice.
    ctx.fillStyle = 'rgba(255,255,255,.07)';
    roundRect(ctx, boardX0() + f.col * CELL + 4, BOARD_TOP + 4, CELL - 8, BOARD_H - 8, 12);
    ctx.fill();
    blit(cellSprite(f.piece.rank, f.piece.charge), cellX(f.col), f.y);
  }

  function drawParticles() {
    for (var i = 0; i < S.particles.length; i++) {
      var p = S.particles[i];
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function fuseSprite(lit) {
    return sprite('fuse|' + (lit ? 1 : 0), 20, 26, function (c, w, h) {
      roundRect(c, 3, 6, w - 6, h - 12, 4);
      if (lit) { c.fillStyle = '#ffd05c'; c.fill(); c.strokeStyle = '#b07a12'; }
      else { c.strokeStyle = 'rgba(30,36,64,.38)'; }
      c.lineWidth = 2.2; c.stroke();
      c.strokeStyle = lit ? '#b07a12' : 'rgba(30,36,64,.38)';
      c.lineWidth = 2.6; c.lineCap = 'round';
      c.beginPath(); c.moveTo(w / 2, 1); c.lineTo(w / 2, 6);
      c.moveTo(w / 2, h - 6); c.lineTo(w / 2, h - 1); c.stroke();
      if (lit) {
        c.strokeStyle = '#fff6d2'; c.lineWidth = 1.8;
        c.beginPath(); c.moveTo(w / 2 - 3, 10); c.lineTo(w / 2 + 3, h - 10); c.stroke();
      }
    });
  }

  function drawHud() {
    var W = view.w;
    for (var i = 0; i < S.maxFuses; i++) blit(fuseSprite(i < S.fuses), 32 + i * 24, 40);
    label('FUSES', 22, 66, 10, 'rgba(30,36,64,.6)', 'left');

    label(fmt(S.score), W / 2, 50, 42, '#1e2440', 'center', 'rgba(255,255,255,.85)');
    label(S.blasts + (S.blasts === 1 ? ' BLAST' : ' BLASTS') +
      (S.bestBlast ? '   BIGGEST ' + S.bestBlast : ''),
      W / 2, 92, 13, '#4f5c8f', 'center', 'rgba(255,255,255,.8)');

    // The queue: three deep, because a merge you cannot see coming is a merge
    // you cannot plan around.
    var qx = W / 2 - CELL * 0.34;
    for (var q = 0; q < 3; q++) {
      var p = S.queue[q];
      if (!p) continue;
      var s = q === 0 ? 0.72 : 0.46;
      ctx.save();
      ctx.translate(qx + (q === 0 ? 0 : CELL * 0.52 + (q - 1) * CELL * 0.4), 176);
      ctx.scale(s, s);
      ctx.globalAlpha = q === 0 ? 1 : 0.62;
      blit(cellSprite(p.rank, p.charge), 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    label('NEXT', qx - CELL * 0.46, 176, 10, 'rgba(30,36,64,.6)', 'right');

    // The floor clock. Same number as the clear budget, drawn as time.
    var T = S.tier;
    var every = Math.max(T.riseMin, T.rise * (1 - S.time * T.riseRamp));
    // Whichever is nearer: the clock, or the drops left before the floor comes
    // up anyway. The gauge has to show the one that is actually going to fire.
    var frac = Math.min(clamp(S.riseT / every, 0, 1),
      clamp(1 - S.sinceRise / dropsPerRise(), 0, 1));
    var bw = BOARD_W, bx = boardX0(), by = BOARD_BOT + 22;
    ctx.fillStyle = 'rgba(30,36,64,.14)';
    roundRect(ctx, bx, by, bw, 14, 7); ctx.fill();
    ctx.fillStyle = frac < 0.25 ? '#ff5e5e' : (frac < 0.55 ? '#ff9430' : '#7a6cf0');
    roundRect(ctx, bx, by, Math.max(6, bw * frac), 14, 7); ctx.fill();
    label('FLOOR', bx, by + 32, 10, 'rgba(30,36,64,.6)', 'left');
    label(budgetOf(T).toFixed(2) + '/SEC OR EVERY ' + dropsPerRise() + ' DROPS',
      bx + bw, by + 32, 10, 'rgba(30,36,64,.6)', 'right');
  }

  function drawFloats() {
    for (var i = 0; i < S.floats.length; i++) {
      var f = S.floats[i];
      ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
      label(f.text, f.x, f.y, f.size, f.col, 'center', 'rgba(24,28,52,.8)');
    }
    ctx.globalAlpha = 1;
  }

  function drawToast() {
    if (S.toastT <= 0) return;
    ctx.globalAlpha = clamp(S.toastT, 0, 1);
    label(S.toastMsg, view.w / 2, BOARD_BOT + 78, 16, '#1e2440', 'center', 'rgba(255,255,255,.9)');
    if (S.toastSub) label(S.toastSub, view.w / 2, BOARD_BOT + 106, 13, '#4f5c8f', 'center', 'rgba(255,255,255,.85)');
    ctx.globalAlpha = 1;
  }
  /* =========================================================================
     11. UI WIRING
     ========================================================================= */
  var ovMenu = document.getElementById('ovMenu');
  var ovOver = document.getElementById('ovOver');
  var ovPause = document.getElementById('ovPause');
  var elFinal = document.getElementById('finalScore');
  var elBest = document.getElementById('bestScore');
  var elBestLabel = document.getElementById('bestLabel');
  var elRecord = document.getElementById('newRecord');
  var elRunStats = document.getElementById('runStats');
  var elMenuHint = document.getElementById('menuHint');
  var elOverTitle = document.getElementById('overTitle');
  var elTierPick = document.getElementById('tierPick');
  var elSuggest = document.getElementById('suggestBox');
  var elSuggestMsg = document.getElementById('suggestMsg');
  var btnSuggest = document.getElementById('btnSuggest');
  var btnSound = document.getElementById('btnSound');
  var btnPause = document.getElementById('btnPause');

  var ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a9 9 0 0 1 0 12"/></svg>';
  var ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6"/><path d="M22 9l-5 6"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.4"/><rect x="14" y="5" width="4" height="14" rx="1.4"/></svg>';
  btnPause.innerHTML = ICON_PAUSE;

  function syncSoundIcon() {
    btnSound.innerHTML = (Sound.muted || !Platform.audioAllowed) ? ICON_OFF : ICON_ON;
  }
  function toggleMute() {
    Sound.muted = !Sound.muted;
    Store.data.muted = Sound.muted;
    Store.save();
    Sound.applyVolume();
    syncSoundIcon();
  }
  btnSound.addEventListener('click', function (e) {
    e.stopPropagation(); Sound.boot(); Sound.resumeCtx(); toggleMute();
  });
  btnPause.addEventListener('click', function (e) {
    e.stopPropagation();
    if (S.mode === 'play') pauseGame();
    else if (S.mode === 'paused') resumeGame();
  });

  var gameOverShown = false;

  function showOverlay(which) {
    ovMenu.hidden = which !== 'menu';
    ovOver.hidden = which !== 'over';
    ovPause.hidden = which !== 'pause';
  }

  function buildTierPicker() {
    elTierPick.innerHTML = '';
    TIERS.forEach(function (T) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tier';
      b.setAttribute('role', 'radio');
      b.id = 'tier-' + T.id;
      b.dataset.tier = T.id;
      b.innerHTML = '<span class="tn"></span><span class="tb"></span>';
      b.querySelector('.tn').textContent = T.name;
      b.querySelector('.tb').textContent = T.blurb;
      b.addEventListener('click', function () { setTier(T.id); Sound.boot(); Sound.ui(); });
      elTierPick.appendChild(b);
    });
    syncTierPicker();
  }

  function syncTierPicker() {
    var kids = elTierPick.children;
    for (var i = 0; i < kids.length; i++) {
      kids[i].setAttribute('aria-checked', kids[i].dataset.tier === Store.data.tier ? 'true' : 'false');
    }
    syncMenuHint();
  }

  function setTier(id) {
    if (Store.data.tier === id) return;
    Store.data.tier = id;
    Store.data.quickDeaths = 0;
    Store.save();
    resetRun();
    syncTierPicker();
  }

  function syncMenuHint() {
    var T = tierById(Store.data.tier);
    var best = Store.best();
    if (best > 0) {
      elMenuHint.innerHTML =
        '<b>' + T.name + '</b> · ' + T.fuses + ' fuses · floor every ' + T.rise + 's or ' +
        T.riseDrops + ' drops<br>best <b>' + fmt(best) + '</b> · biggest blast ' +
        Store.blast() + ' · rank ' + Store.rank();
    } else {
      elMenuHint.innerHTML =
        '<b>' + T.name + '</b> · ' + T.fuses + ' fuses<br>' +
        '<b>Tap a column</b> to drop. Same ranks fuse into one a rank higher —<br>' +
        'and it keeps the charge only if every piece agreed.<br>' +
        'Four of a charge in a row and the lot goes up.';
    }
  }

  function startRun() {
    Sound.boot(); Sound.resumeCtx();
    gameOverShown = false;
    resetRun();
    S.mode = 'play';
    showOverlay(null);
    Sound.ui();
    toast('TAP A COLUMN TO DROP', 'merge to grow · four of a charge to blow');
  }

  function showGameOver() {
    gameOverShown = true;
    var T = S.tier;
    var final = Math.floor(S.score);
    var isRecord = final > Store.best(T.id);
    if (isRecord) Store.data.bests[T.id] = final;
    if (S.bestBlast > Store.blast(T.id)) Store.data.bestBlast[T.id] = S.bestBlast;
    if (S.bestRank > Store.rank(T.id)) Store.data.bestRank[T.id] = S.bestRank;
    Store.data.runs++;

    if (S.blasts < 3) Store.data.quickDeaths++;
    else Store.data.quickDeaths = 0;

    elOverTitle.textContent = overTitleText;
    elFinal.textContent = fmt(final);
    elBest.textContent = fmt(Store.best(T.id));
    elBestLabel.textContent = 'Best · ' + T.name;
    elRecord.hidden = !isRecord;
    elRunStats.textContent =
      S.blasts + ' blasts · biggest ' + S.bestBlast + ' · rank ' + S.bestRank + ' · chain ' +
      S.bestChain + ' · ' + S.vents + ' vented · ' + Math.floor(S.time) + 's' +
      (S.fusesWon ? ' · ' + S.fusesWon + ' fuses won' : '');

    applySuggestion(T);
    Store.save();
    showOverlay('over');
  }

  var suggestTarget = null;

  function applySuggestion(T) {
    var idx = tierIndex(T.id);
    suggestTarget = null;
    if (Store.data.quickDeaths >= 3 && idx > 0 && !Store.data.offeredDown) {
      suggestTarget = TIERS[idx - 1];
      elSuggestMsg.textContent =
        'Three runs without much going off. ' + suggestTarget.name + ' asks for ' +
        budgetOf(suggestTarget).toFixed(2) + ' cells a second instead of ' +
        budgetOf(T).toFixed(2) + ', which is time to build something.';
      btnSuggest.textContent = 'Switch to ' + suggestTarget.name;
      Store.data.offeredDown = true;
    } else if (S.bestBlast >= 8 && idx < TIERS.length - 1 && !Store.data.offeredUp) {
      suggestTarget = TIERS[idx + 1];
      elSuggestMsg.textContent =
        'A run of ' + S.bestBlast + ' went up at once. ' + suggestTarget.name +
        ' brings the floor up faster and pays ' + suggestTarget.scoreMul + '×.';
      btnSuggest.textContent = 'Try ' + suggestTarget.name;
      Store.data.offeredUp = true;
    }
    elSuggest.hidden = !suggestTarget;
  }

  btnSuggest.addEventListener('click', function () {
    if (!suggestTarget) return;
    setTier(suggestTarget.id);
    startRun();
  });

  function pauseGame() {
    if (S.mode !== 'play') return;
    S.mode = 'paused';
    Sound.hum(0);
    Sound.hardStop();
    showOverlay('pause');
  }

  function resumeGame() {
    if (S.mode !== 'paused') return;
    Sound.resumeCtx();
    Sound.applyVolume();
    S.mode = 'play';
    last = performance.now();
    showOverlay(null);
  }

  function toMenu() {
    S.mode = 'menu';
    resetRun();
    syncTierPicker();
    Sound.hum(0);
    showOverlay('menu');
  }

  document.getElementById('btnPlay').addEventListener('click', startRun);
  document.getElementById('btnAgain').addEventListener('click', startRun);
  document.getElementById('btnMenu').addEventListener('click', toMenu);
  document.getElementById('btnResume').addEventListener('click', resumeGame);
  document.getElementById('btnQuit').addEventListener('click', function () {
    if (gameOverShown) return;
    S.mode = 'dead'; S.deathT = 0;
    overTitleText = 'Powered Down';
    Sound.hum(0);
    showGameOver();
  });

  /* =========================================================================
     13. PLATFORM PAUSE / VISIBILITY
     ========================================================================= */
  var hardPaused = false;

  function platformPause() {
    hardPaused = true;
    Sound.hardStop();
    if (S.mode === 'play') pauseGame();
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }
  function platformResume() {
    hardPaused = false;
    Sound.resumeCtx();
    Sound.applyVolume();
    last = performance.now();
    if (!raf) raf = requestAnimationFrame(frame);
  }

  Platform.init(platformPause, platformResume, function () {
    Sound.applyVolume();
    syncSoundIcon();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) platformPause(); else platformResume();
  });
  window.addEventListener('blur', function () {
    if (S.mode === 'play') pauseGame();
  });

  /* =========================================================================
     14. MAIN LOOP
     ========================================================================= */
  var last = 0, raf = 0, painted = false;

  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (hardPaused) return;
    var dt = (now - last) / 1000;
    last = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    dt = Math.min(dt, 0.05);
    if (S.mode === 'paused') return;   // no rendering at all while paused
    update(dt);
    render();
    if (!painted) { painted = true; Platform.firstFrame(); Platform.ready(); }
  }

  /* =========================================================================
     15. BOOT
     ========================================================================= */
  function boot() {
    layout();
    Sound.muted = !!Store.data.muted;
    syncSoundIcon();
    buildTierPicker();
    resetRun();
    elBest.textContent = fmt(Store.best());
    showOverlay('menu');
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', layout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 120); });

  Store.load(boot);
})();
</script>
</body>
